# Deploys the clean-room Switchboard server to Cloud Run after CI passes on main (or by hand).
# Authenticates with Workload Identity Federation: no GCP key is stored in GitHub. The new revision
# takes no traffic until the smoke test passes; a failed smoke test leaves the previous revision
# serving. Demos are not part of this pipeline: .github/workflows/deploy-demo.yml deploys and seeds
# an optional demo against a server this pipeline already deployed.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      min_instances:
        description: "Switchboard minimum instances (1 keeps it warm and ready for calls; 0 stops idle spend — the SQLite store is wiped on the next cold start and starts empty until the demo pipeline seeds it again — and the first call after idle waits for a cold start)"
        default: "1"
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # Only our own code deploys: a push to main that passed CI, or a dispatch from main. A fork PR from a
    # branch that is also called main matches `branches: [main]` above, so its run must be refused here.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      MIN_INSTANCES: ${{ inputs.min_instances || '1' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/switchboard
      PROVIDER_SECRETS: ${{ vars.GCP_PROVIDER_SECRETS }}   # optional provider keys bootstrap.sh found, space separated
    steps:
      - name: Validate inputs
        run: |
          [[ "${MIN_INSTANCES}" =~ ^[0-9]+$ ]] || { echo "min_instances must be a number, got '${MIN_INSTANCES}'" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the server image
        run: |
          docker build -q -f deploy/Dockerfile --build-arg VERSION="${SHA::7}" --build-arg COMMIT="${SHA}" -t "${REGISTRY}/switchboard:${SHA}" .
          docker push "${REGISTRY}/switchboard:${SHA}"

      - name: Mount the optional provider keys
        run: |
          PROVIDER_ENV=""
          for s in ${PROVIDER_SECRETS}; do
            case "${s}" in
              OPENAI_API_KEY|DEEPGRAM_API_KEY|CARTESIA_API_KEY|NVIDIA_API_KEY) ;;
              *) echo "GCP_PROVIDER_SECRETS may name only OPENAI_API_KEY, DEEPGRAM_API_KEY, CARTESIA_API_KEY and NVIDIA_API_KEY, got '${s}'" >&2; exit 1 ;;
            esac
            case "${PROVIDER_ENV}" in *"name: ${s}"*) echo "duplicate provider secret ${s}" >&2; exit 1 ;; esac
            PROVIDER_ENV+=$'\n'"            - name: ${s}"$'\n'"              valueFrom: {secretKeyRef: {name: ${s}, key: latest}}"
          done
          { echo "PROVIDER_ENV<<__PROVIDER_ENV__"; printf '%s\n' "${PROVIDER_ENV}"; echo "__PROVIDER_ENV__"; } >> "$GITHUB_ENV"

      - name: Deploy Switchboard as a candidate (existing traffic stays on the serving revision)
        run: |
          export IMAGE="${REGISTRY}/switchboard:${SHA}"
          envsubst '${REGION} ${PROJECT_ID} ${IMAGE} ${MIN_INSTANCES} ${PROVIDER_ENV}' < deploy/gcp/switchboard.service.yaml > /tmp/switchboard.yaml
          # The serving revision (100% traffic). "Not found" is the first deploy; any other failure stops the deploy.
          if gcloud run services describe switchboard --region "${REGION}" --project "${PROJECT_ID}" --format=json > /tmp/svc.json 2> /tmp/svc.err; then
            PREV="$(jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName // empty][0] // empty' /tmp/svc.json)"
          elif grep -qiE 'not found|NOT_FOUND|could not be found' /tmp/svc.err; then
            PREV=""
          else
            cat /tmp/svc.err >&2; echo "could not read the serving revision" >&2; exit 1
          fi
          if [ -n "${PREV}" ]; then
            # spec.traffic is a sibling of spec.template: keep 100% on the serving revision; the new one gets 0% and a tag.
            printf '  traffic:\n    - revisionName: %s\n      percent: 100\n    - latestRevision: true\n      percent: 0\n      tag: candidate\n' "${PREV}" >> /tmp/switchboard.yaml
          fi
          gcloud run services replace /tmp/switchboard.yaml --region "${REGION}" --project "${PROJECT_ID}"
          gcloud run services add-iam-policy-binding switchboard --region "${REGION}" --project "${PROJECT_ID}" \
            --member=allUsers --role=roles/run.invoker >/dev/null
          URL="$(gcloud run services describe switchboard --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')"
          echo "SERVICE_URL=${URL}" >> "$GITHUB_ENV"
          echo "PREV_REVISION=${PREV}" >> "$GITHUB_ENV"
          if [ -n "${PREV}" ]; then echo "SMOKE_URL=https://candidate---${URL#https://}" >> "$GITHUB_ENV"; else echo "SMOKE_URL=${URL}" >> "$GITHUB_ENV"; fi

      - name: Smoke test the candidate
        run: |
          set +x
          GOVOICE_MANAGEMENT_API_KEY="$(gcloud secrets versions access latest --secret=SWITCHBOARD_MANAGEMENT_API_KEY --project "${PROJECT_ID}")"
          export GOVOICE_MANAGEMENT_API_KEY
          echo "::add-mask::${GOVOICE_MANAGEMENT_API_KEY}"
          deploy/smoke-cloudrun.sh "${SMOKE_URL}"

      - name: Take the tag off a failed candidate
        if: failure() && env.PREV_REVISION != ''
        run: gcloud run services update-traffic switchboard --remove-tags candidate --region "${REGION}" --project "${PROJECT_ID}" || true

      - name: Promote the candidate
        run: |
          if [ -n "${PREV_REVISION}" ]; then
            gcloud run services update-traffic switchboard --to-latest --region "${REGION}" --project "${PROJECT_ID}"
            gcloud run services update-traffic switchboard --remove-tags candidate --region "${REGION}" --project "${PROJECT_ID}"
          fi
          echo "### Deployed ${SHA::7}: ${SERVICE_URL}" >> "$GITHUB_STEP_SUMMARY"
