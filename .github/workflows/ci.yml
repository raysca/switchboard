# Continuous integration (M4-01). Every job runs the same Makefile targets a developer runs locally, so
# a green CI means `make verify`, the xAI speech (-tags xaispeech) tests, the race detector, the
# Postgres store tests and the production image smoke all pass. No provider keys are used anywhere:
# tests use fake providers and the smoke test starts the image without credentials.
#
# Required status checks to configure on main: linux, macos, postgres, image-smoke, graph-e2e.
# perf-gate.yml is advisory (see docs/benchmarks/README.md, "CI policy").
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # make verify = build (-tags xaispeech) + go vet (with and without the tag) + go test -race for every
  # module + gofmt + manifest/fixture/playback-clear checks. ONNX Runtime is git-ignored: `make ort`
  # downloads the pinned release (sha256-verified on Linux).
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # tools/compat parity tests read the pinned pipecat-impl revision
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/compat   # released @pipecat-ai client packages for the compat tests
      - run: make ort
      - run: make verify

  # Agent graphs in a real browser against the fake providers (no keys, no cost): the designer, a live
  # call with a handoff, the live graph view, republish and a failed handoff. Gates merging the feature.
  graph-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make ort
      - run: npm ci --prefix e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make e2e-fake
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: graph-e2e-report
          path: |
            e2e/test-results-graph
            e2e/playwright-report-graph
            e2e/evidence
          retention-days: 7

  # The reference platform for the committed benchmarks; also proves the macOS cgo/ORT path.
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # tools/compat parity tests read the pinned pipecat-impl revision
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/compat   # released @pipecat-ai client packages for the compat tests
      - run: make ort
      - run: make verify

  # Storage and migration tests against the production database (skipped by `make test`).
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: govoice
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEST_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/govoice?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-postgres

  # Builds the production image and probes it from outside the container with no provider key:
  # /ready, /metrics, loopback-only admin, xAI speech compiled in, clean SIGTERM exit.
  image-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: deploy/smoke.sh
