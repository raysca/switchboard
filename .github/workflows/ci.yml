# Continuous integration (M4-01). Every job runs the same Makefile targets a developer runs locally, so
# a green CI means `make verify`, the xAI speech (-tags xaispeech) tests, the race detector and the
# production image smoke all pass. No provider keys are used anywhere: tests use fake providers and the
# smoke test starts the image without credentials. The Postgres store tests are off for now (SQLite is the
# store we run and test); set the repository variable RUN_POSTGRES_TESTS=true to turn them back on.
#
# Required status checks to configure on main: test, image-smoke, graph-e2e (postgres only once enabled).
# There is no macOS job: the server ships only as the Linux container image (deploy/Dockerfile), so CI
# verifies on ubuntu and smokes the image. perf-gate.yml still runs on macos-14 for the benchmarks.
# perf-gate.yml is advisory (see docs/benchmarks/README.md, "CI policy").
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The test suite, not a build for the Linux platform: the server ships only as the container image.
  # make verify = build (-tags xaispeech) + go vet (with and without the tag) + go test -race for every
  # module + gofmt + manifest/fixture/playback-clear checks. ONNX Runtime is git-ignored: `make ort`
  # downloads the pinned release (sha256-verified on Linux).
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # tools/compat parity tests read the pinned pipecat-impl revision
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/compat   # released @pipecat-ai client packages for the compat tests
      - run: make ort
      - run: make verify

  # Agent graphs in a real browser against the fake providers (no keys, no cost): the designer, a live
  # call with a handoff, the live graph view, republish and a failed handoff. Gates merging the feature.
  graph-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make ort
      - run: npm ci --prefix e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make eval-agents-echo
      - run: make e2e-fake
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: graph-e2e-report
          path: |
            e2e/test-results-agents
            e2e/playwright-report-agents
            e2e/evidence
          retention-days: 7

  # Storage and migration tests against the production database (skipped by `make test`).
  postgres:
    if: vars.RUN_POSTGRES_TESTS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: govoice
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEST_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/govoice?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-postgres

  deadcode:
    runs-on: ubuntu-24.04
    continue-on-error: true   # advisory: a new unreachable function is a review question, not a red build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make deadcode

  # Builds the production image and probes it from outside the container with no provider key:
  # /ready, /metrics, loopback-only admin, xAI speech compiled in, clean SIGTERM exit. The server
  # image is clean-room: it ships no demo MCP server. The same job builds the optional demo assets
  # (demos/ extraction): the seed client and each demo MCP image, with no provider key and no cloud
  # credentials, proving they build, refuse to run without their bearer token, and answer /health.
  image-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: deploy/smoke.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The seed client builds
        run: go build -o /tmp/seed ./demos/seed
      - name: dental-mcp image builds, refuses to run without a token, answers /health
        run: |
          docker build -q -f demos/dental/deploy/cloudrun/Dockerfile.mcp -t dental-mcp:ci .
          ! docker run --rm dental-mcp:ci 2>/dev/null
          docker run -d --name dmcp -p 18767:8081 -e DENTAL_MCP_TOKEN=ci-token-ci-token-ci dental-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18767/health && break || sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18767/mcp)" = 401
          docker rm -f dmcp
      - name: atlas-mcp image builds, binds every interface, refuses without a token
        run: |
          docker build -q -f demos/atlas/deploy/cloudrun/Dockerfile.mcp -t atlas-mcp:ci .
          ! docker run --rm atlas-mcp:ci 2>/dev/null
          docker run -d --name amcp -p 18768:8081 -e ATLAS_MCP_TOKEN=ci-token-ci-token-ci atlas-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18768/health && break || sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18768/mcp)" = 401
          # the /api fixture tools are public by design and shared with the HTTP tools
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18768/api/weather?city=london')" = 200
          docker rm -f amcp
