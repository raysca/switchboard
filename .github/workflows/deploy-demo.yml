# Optional demo deployment: deploys ONE demo's MCP service and seeds the demo into an already
# deployed clean-room server. This is separate from the server pipeline (.github/workflows/deploy.yml);
# the server image and its deployment carry no demo assets.
#
# Called by .github/workflows/deploy-demo-dispatch.yml (workflow_dispatch) or from another workflow
# with `uses: ./.github/workflows/deploy-demo.yml` and `secrets: inherit`.
#
# Inputs:
#   demo                  dental or atlas
#   target                cloudrun or cloudflare
#   environment           GitHub environment holding the per-demo token secret and, on Cloudflare,
#                         the management key and CLOUDFLARE_API_TOKEN. The token secrets are
#                         DENTAL_MCP_TOKEN / ATLAS_MCP_TOKEN; they are per-demo deployment secrets,
#                         never generated by this workflow.
#   server_admin_url      base URL of the clean-room server (public admin or admin listener)
#   management_key_secret source name of the management key: the Secret Manager secret name on
#                         Cloud Run, the GitHub environment secret name on Cloudflare
#   mcp_base_url          Cloudflare only: the public demo Worker URL (required; not discoverable)
#   auto_seed             run the seed client after deploying (default true)
#   image_tag             image tag to build/push (defaults to the commit SHA)
#
# The seed runs as a workflow step (`go run ./demos/seed`) on the runner: there is no seed image and
# no Kubernetes Job. Both the management key and the demo token are masked; a failed seed fails the
# workflow, and re-running it wipes and recreates the demo.
name: deploy-demo
on:
  workflow_call:
    inputs:
      demo:
        description: "Demo to deploy: dental or atlas"
        required: true
        type: string
      target:
        description: "Deployment target: cloudrun or cloudflare"
        required: true
        type: string
      environment:
        description: "GitHub environment holding the per-demo token secret (and CLOUDFLARE_API_TOKEN on Cloudflare)"
        required: true
        type: string
      server_admin_url:
        description: "Base URL of the clean-room server to seed"
        required: true
        type: string
      management_key_secret:
        description: "Management key source name: Secret Manager secret (cloudrun) or environment secret (cloudflare)"
        required: true
        type: string
      mcp_base_url:
        description: "Cloudflare only: public base URL of the deployed demo Worker"
        required: false
        type: string
        default: ""
      auto_seed:
        description: "Seed the demo after deploying it"
        required: false
        type: boolean
        default: true
      image_tag:
        description: "Image tag for the demo MCP image (defaults to the commit SHA)"
        required: false
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-demo-${{ inputs.demo }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      DEMO: ${{ inputs.demo }}
      TARGET: ${{ inputs.target }}
      SERVER_ADMIN_URL: ${{ inputs.server_admin_url }}
      MANAGEMENT_KEY_SECRET: ${{ inputs.management_key_secret }}
      MCP_BASE_URL: ${{ inputs.mcp_base_url }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      # Per-demo deployment secrets from the GitHub environment (used directly on Cloudflare and
      # fetched from Secret Manager on Cloud Run for the seed step).
      DENTAL_MCP_TOKEN: ${{ secrets.DENTAL_MCP_TOKEN }}
      ATLAS_MCP_TOKEN: ${{ secrets.ATLAS_MCP_TOKEN }}
      # Cloudflare: the management key from the environment secret named by the input. Cloud Run
      # fetches it from Secret Manager instead.
      MANAGEMENT_KEY: ${{ secrets[inputs.management_key_secret] }}
    steps:
      - name: Mask the deployment secrets
        run: |
          set +x
          for s in "${MANAGEMENT_KEY}" "${DENTAL_MCP_TOKEN}" "${ATLAS_MCP_TOKEN}"; do
            [[ -z "${s}" ]] || echo "::add-mask::${s}"
          done

      - name: Validate inputs
        run: |
          set -euo pipefail
          case "${DEMO}" in dental|atlas) ;; *) echo "demo must be dental or atlas, got '${DEMO}'" >&2; exit 1 ;; esac
          case "${TARGET}" in cloudrun|cloudflare) ;; *) echo "target must be cloudrun or cloudflare, got '${TARGET}'" >&2; exit 1 ;; esac
          [[ -n "${SERVER_ADMIN_URL}" ]] || { echo "server_admin_url is required" >&2; exit 1; }
          [[ -n "${MANAGEMENT_KEY_SECRET}" ]] || { echo "management_key_secret is required" >&2; exit 1; }
          if [[ "${TARGET}" = cloudrun ]]; then
            [[ -n "${PROJECT_ID}" && -n "${REGION}" ]] || { echo "cloudrun needs the GCP_PROJECT_ID and GCP_REGION repository variables" >&2; exit 1; }
          else
            [[ -n "${MCP_BASE_URL}" ]] || { echo "mcp_base_url is required for the cloudflare target (the demo Worker URL is not discoverable without credentials)" >&2; exit 1; }
          fi

      - name: Resolve demo paths and its token secret name
        run: |
          set -euo pipefail
          case "${DEMO}" in
            dental) MCP_DIR=demos/dental; MCP_LOGICAL=scheduling; DEMO_TOKEN_SECRET=DENTAL_MCP_TOKEN ;;
            atlas)  MCP_DIR=demos/atlas;  MCP_LOGICAL=inventory;  DEMO_TOKEN_SECRET=ATLAS_MCP_TOKEN ;;
          esac
          { echo "MCP_DIR=${MCP_DIR}"; echo "MCP_LOGICAL=${MCP_LOGICAL}"; echo "DEMO_TOKEN_SECRET=${DEMO_TOKEN_SECRET}"; } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Authenticate to Google Cloud (Cloud Run target)
        if: inputs.target == 'cloudrun'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: inputs.target == 'cloudrun'
      - name: Point Docker at Artifact Registry
        if: inputs.target == 'cloudrun'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Deploy the demo MCP service (Cloud Run)
        id: cloudrun
        if: inputs.target == 'cloudrun'
        env:
          AR_REPO: ${{ vars.GCP_AR_REPO || 'switchboard' }}
        run: bash "${MCP_DIR}/deploy/cloudrun/deploy.sh"

      - uses: actions/setup-node@v4
        if: inputs.target == 'cloudflare'
        with:
          node-version: '22'
      - name: Deploy the demo Worker and container (Cloudflare)
        if: inputs.target == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || { echo "set the CLOUDFLARE_API_TOKEN environment secret" >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]] || { echo "set the CLOUDFLARE_ACCOUNT_ID repository variable" >&2; exit 1; }
          case "${DEMO_TOKEN_SECRET}" in
            DENTAL_MCP_TOKEN) DEMO_TOKEN_VALUE="${DENTAL_MCP_TOKEN}" ;;
            ATLAS_MCP_TOKEN)  DEMO_TOKEN_VALUE="${ATLAS_MCP_TOKEN}" ;;
          esac
          [[ -n "${DEMO_TOKEN_VALUE}" ]] || { echo "set the ${DEMO_TOKEN_SECRET} environment secret for this demo" >&2; exit 1; }
          echo "::add-mask::${DEMO_TOKEN_VALUE}"
          CONFIG="${MCP_DIR}/deploy/cloudflare/wrangler.jsonc"
          # The first deploy creates the Worker and its container; the secret can then be attached.
          # Per-demo tokens are deployment secrets: publish the environment secret as a Wrangler
          # secret (stdin, never an argument) and never generate one here. The second deploy applies
          # the secret binding before the health check below sends any traffic.
          npx --yes wrangler@4 deploy --config "${CONFIG}"
          printf %s "${DEMO_TOKEN_VALUE}" | npx --yes wrangler@4 secret put "${DEMO_TOKEN_SECRET}" --config "${CONFIG}"
          npx --yes wrangler@4 deploy --config "${CONFIG}"

      - name: Resolve the deployed demo endpoints
        id: urls
        run: |
          set -euo pipefail
          if [[ "${TARGET}" = cloudrun ]]; then
            ENDPOINT="${{ steps.cloudrun.outputs.mcp_url }}"
            HTTP_BASE="${{ steps.cloudrun.outputs.http_base }}"
          else
            BASE="${MCP_BASE_URL%/}"
            ENDPOINT="${BASE}/mcp"
            HTTP_BASE="${BASE}"
          fi
          [[ -n "${ENDPOINT}" ]] || { echo "could not resolve the demo MCP endpoint" >&2; exit 1; }
          # seed takes the base URL and appends the demo's endpoint path (/mcp itself).
          MCP_BASE="${ENDPOINT%/mcp}"
          { echo "mcp_base=${MCP_BASE}"; echo "mcp_endpoint=${ENDPOINT}"; echo "http_base=${HTTP_BASE}"; } >> "$GITHUB_OUTPUT"
          echo "demo MCP endpoint: ${ENDPOINT}"

      - name: Wait for the demo MCP service
        env:
          MCP_ENDPOINT: ${{ steps.urls.outputs.mcp_endpoint }}
          MCP_BASE: ${{ steps.urls.outputs.mcp_base }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            curl -fsS --max-time 5 "${MCP_BASE}/health" >/dev/null 2>&1 && break || sleep 2
          done
          curl -fsS --max-time 10 "${MCP_BASE}/health" >/dev/null || { echo "the demo MCP service is not healthy at ${MCP_BASE}/health" >&2; exit 1; }
          # The demo bearer token is the protection: an unauthenticated request must be refused.
          code="$(curl -s -o /dev/null -w '%{http_code}' "${MCP_ENDPOINT}")"
          [[ "${code}" == 401 ]] || { echo "an unauthenticated request to ${MCP_ENDPOINT} answered ${code}, want 401 (the demo token is not wired)" >&2; exit 1; }

      - name: Seed the demo
        if: inputs.auto_seed
        env:
          MCP_BASE: ${{ steps.urls.outputs.mcp_base }}
          HTTP_BASE: ${{ steps.urls.outputs.http_base }}
        run: |
          set -euo pipefail
          if [[ "${TARGET}" = cloudrun ]]; then
            MANAGEMENT_KEY_VALUE="$(gcloud secrets versions access latest --secret="${MANAGEMENT_KEY_SECRET}" --project "${PROJECT_ID}")"
            DEMO_TOKEN_VALUE="$(gcloud secrets versions access latest --secret="${DEMO_TOKEN_SECRET}" --project "${PROJECT_ID}")"
          else
            MANAGEMENT_KEY_VALUE="${MANAGEMENT_KEY}"
            case "${DEMO_TOKEN_SECRET}" in
              DENTAL_MCP_TOKEN) DEMO_TOKEN_VALUE="${DENTAL_MCP_TOKEN}" ;;
              ATLAS_MCP_TOKEN)  DEMO_TOKEN_VALUE="${ATLAS_MCP_TOKEN}" ;;
            esac
          fi
          [[ -n "${MANAGEMENT_KEY_VALUE}" ]] || { echo "the management key is empty: check the management_key_secret input and its source" >&2; exit 1; }
          [[ -n "${DEMO_TOKEN_VALUE}" ]] || { echo "the ${DEMO_TOKEN_SECRET} deployment secret is empty" >&2; exit 1; }
          echo "::add-mask::${MANAGEMENT_KEY_VALUE}"
          echo "::add-mask::${DEMO_TOKEN_VALUE}"
          args=(--server "${SERVER_ADMIN_URL}" --key-env GOVOICE_MANAGEMENT_API_KEY --demo "${DEMO}"
                --mcp "${MCP_LOGICAL}=${MCP_BASE}" --wait 25m --yes)
          [[ -z "${HTTP_BASE}" ]] || args+=(--http-base "${HTTP_BASE}")
          # The seed reads the demo token from the variable named by the demo spec.
          env "${DEMO_TOKEN_SECRET}=${DEMO_TOKEN_VALUE}" GOVOICE_MANAGEMENT_API_KEY="${MANAGEMENT_KEY_VALUE}" \
            go run ./demos/seed "${args[@]}"

      - name: Print the seed command (auto_seed is off)
        if: ${{ !inputs.auto_seed }}
        env:
          MCP_BASE: ${{ steps.urls.outputs.mcp_base }}
          HTTP_BASE: ${{ steps.urls.outputs.http_base }}
        run: |
          set -euo pipefail
          # Only the env indirection is printed: no secret value ever reaches the log.
          {
            echo "Seed the demo into ${SERVER_ADMIN_URL} by hand:"
            echo
            echo '  export GOVOICE_MANAGEMENT_API_KEY="<the management key>"'
            printf '  export %s="<the demo MCP token>"\n' "${DEMO_TOKEN_SECRET}"
            printf '  go run ./demos/seed --server %q --key-env GOVOICE_MANAGEMENT_API_KEY --demo %q --mcp %q --wait 25m' \
              "${SERVER_ADMIN_URL}" "${DEMO}" "${MCP_LOGICAL}=${MCP_BASE}"
            [[ -z "${HTTP_BASE}" ]] || printf ' --http-base %q' "${HTTP_BASE}"
            printf ' --yes\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize the deployment
        run: |
          {
            echo "### Demo deployed: ${DEMO} (${TARGET})"
            echo
            echo "- MCP endpoint: ${{ steps.urls.outputs.mcp_endpoint }}"
            echo "- Seeded: ${{ inputs.auto_seed }}"
          } >> "$GITHUB_STEP_SUMMARY"
