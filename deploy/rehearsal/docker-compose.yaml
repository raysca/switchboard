# Rehearse the clean-room Cloud Run deployment on your machine with REAL providers (spends a little
# credit). 1. cp .env.example .env and fill it in    2. cp your Google service-account JSON to
# ./google.json (chmod 644)    3. docker compose -f deploy/rehearsal/docker-compose.yaml up --build
# 4. open http://localhost:8080 — the store starts empty; demos are seeded separately (see README.md).
# For a no-cost plumbing check use placeholder values in .env: the server only needs the variables to exist.
services:
  govoice:
    build: {context: ../.., dockerfile: deploy/Dockerfile}
    command: ["/opt/govoice/bin/server", "-config", "/etc/rehearsal/server.yaml"]
    env_file: .env
    environment:
      GOVOICE_DATABASE_DSN: postgres://switchboard:rehearsal@postgres:5432/switchboard?sslmode=disable
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google.json
      # The encrypted secret store: seed writes the demo MCP token here, so the server carries no
      # demo token in its environment. Required for the optional demo seed step (see README.md).
      SWITCHBOARD_SECRETS_KEY: "${SWITCHBOARD_SECRETS_KEY:?set SWITCHBOARD_SECRETS_KEY in .env (k1: plus 32 base64 bytes)}"
    volumes:
      - ./server.yaml:/etc/rehearsal/server.yaml:ro
      - ./google.json:/secrets/google.json:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: {postgres: {condition: service_healthy}}
  postgres:                              # stands in for Cloud SQL; the data is thrown away with the container
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment: {POSTGRES_USER: switchboard, POSTGRES_PASSWORD: rehearsal, POSTGRES_DB: switchboard}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U switchboard"], interval: 2s, timeout: 3s, retries: 30}
  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [govoice]

networks:
  default:
    ipam:
      config:
        - subnet: 10.231.77.0/24   # pinned so server.yaml can trust exactly the proxy's network
