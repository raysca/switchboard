# Switchboard on Cloud Run: ONE instance (live calls are in memory), CPU always allocated (a call
# is a long-lived request that needs CPU between requests), 60-minute request timeout (a call is a
# WebSocket request; the server caps a call at 20 minutes itself). Flows and call history live in
# Cloud SQL (Postgres), so a deploy or a restart loses nothing. Sizing: max_sessions (config/cloudrun.yaml)
# is below containerConcurrency on purpose, so admin and probe requests never wait behind calls.
# Rendered with envsubst by .github/workflows/deploy.yml; ${...} placeholders are checked by
# server/gcp_manifest_test.go. The last env entry is the optional provider keys, built by deploy.yml.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: switchboard
  labels:
    cloud.googleapis.com/location: ${REGION}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "${MIN_INSTANCES}"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/sessionAffinity: "true"
        run.googleapis.com/cloudsql-instances: ${PROJECT_ID}:${REGION}:switchboard-db
    spec:
      serviceAccountName: switchboard-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 3600
      containers:
        - image: ${IMAGE}
          command: ["/usr/bin/tini"]
          args: ["--", "/opt/govoice/bin/server", "-config", "/etc/govoice/cloudrun.yaml"]
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          env:
            - {name: DENTAL_MCP_URL, value: "${DENTAL_MCP_URL}"}
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: /secrets/google/key.json}
            - name: GOVOICE_DATABASE_DSN   # the variable the server reads; the secret is named for the product
              valueFrom: {secretKeyRef: {name: SWITCHBOARD_DATABASE_DSN, key: latest}}
            - name: TOKEN_SECRET
              valueFrom: {secretKeyRef: {name: TOKEN_SECRET, key: latest}}
            - name: GOVOICE_MANAGEMENT_API_KEY   # the variable the server reads
              valueFrom: {secretKeyRef: {name: SWITCHBOARD_MANAGEMENT_API_KEY, key: latest}}
            - name: XAI_API_KEY
              valueFrom: {secretKeyRef: {name: XAI_API_KEY, key: latest}}
            - name: ELEVENLABS_API_KEY
              valueFrom: {secretKeyRef: {name: ELEVENLABS_API_KEY, key: latest}}
            - name: GOOGLE_API_KEY
              valueFrom: {secretKeyRef: {name: GOOGLE_API_KEY, key: latest}}
            - name: MCP_TOKEN_DENTAL
              valueFrom: {secretKeyRef: {name: DENTAL_MCP_TOKEN, key: latest}}
            ${PROVIDER_ENV}
          volumeMounts:
            - {name: google-key, mountPath: /secrets/google}
      volumes:
        - name: google-key
          secret:
            secretName: GOOGLE_SA_KEY
            items:
              - {key: latest, path: key.json}
