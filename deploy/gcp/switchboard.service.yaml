# Switchboard on Cloud Run: ONE instance (live calls are in memory), CPU always allocated (a call
# is a long-lived request that needs CPU between requests), 60-minute request timeout (a call is a
# WebSocket request; the server caps a call at 20 minutes itself). This is the SQLite deployment
# profile: agents and call history live in /tmp inside the container and are wiped on every deploy
# and cold start, so a clean deployment starts with an empty store. Demos are optional and seeded
# afterwards by the separate demo pipeline (.github/workflows/deploy-demo.yml); the server never
# installs one. Sizing: max_sessions (config/cloudrun-sqlite.yaml) is below containerConcurrency on
# purpose, so admin and probe requests never wait behind calls.
# Rendered with envsubst by .github/workflows/deploy.yml; ${...} placeholders are checked by
# server/gcp_manifest_test.go. The last env entry is the optional provider keys, built by deploy.yml.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: switchboard
  labels:
    cloud.googleapis.com/location: ${REGION}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "${MIN_INSTANCES}"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/sessionAffinity: "true"
    spec:
      serviceAccountName: switchboard-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 3600
      containers:
        - image: ${IMAGE}
          command: ["/usr/bin/tini"]
          args: ["--", "/opt/govoice/bin/server", "-config", "/etc/govoice/cloudrun-sqlite.yaml"]
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          env:
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: /secrets/google/key.json}
            # SQLite deployment: the database is a file in the container's writable tmpfs, not a secret.
            - {name: GOVOICE_DATABASE_DSN, value: "/tmp/switchboard.db"}
            - name: TOKEN_SECRET
              valueFrom: {secretKeyRef: {name: TOKEN_SECRET, key: latest}}
            - name: GOVOICE_MANAGEMENT_API_KEY   # the variable the server reads
              valueFrom: {secretKeyRef: {name: SWITCHBOARD_MANAGEMENT_API_KEY, key: latest}}
            # The encrypted secret store: seed writes each demo MCP token here, so the clean-room
            # server carries no demo token in its environment.
            - name: SWITCHBOARD_SECRETS_KEY
              valueFrom: {secretKeyRef: {name: SWITCHBOARD_SECRETS_KEY, key: latest}}
            - name: XAI_API_KEY
              valueFrom: {secretKeyRef: {name: xai-api-key, key: latest}}
            - name: ELEVENLABS_API_KEY
              valueFrom: {secretKeyRef: {name: elevenlabs-api-key, key: latest}}
            - name: GOOGLE_API_KEY
              valueFrom: {secretKeyRef: {name: google-api-key, key: latest}}
            ${PROVIDER_ENV}
          volumeMounts:
            - {name: google-key, mountPath: /secrets/google}
      volumes:
        - name: google-key
          secret:
            secretName: GOOGLE_SA_KEY
            items:
              - {key: latest, path: key.json}
