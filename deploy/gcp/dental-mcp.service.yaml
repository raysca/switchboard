# The demo's scheduling MCP server: in-memory fake data, so at most one instance; scales to zero.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dental-mcp
  labels:
    cloud.googleapis.com/location: ${REGION}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: govoice-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 2
            failureThreshold: 10
          env:
            - name: DENTAL_MCP_TOKEN
              valueFrom: {secretKeyRef: {name: DENTAL_MCP_TOKEN, key: latest}}
