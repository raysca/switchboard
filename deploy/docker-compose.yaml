# Production Docker Compose definition for Voice Framework V1
# Fulfills spec §39 (Non-root, read-only root, declared writables, capability drops, health checks)

services:
  govoice:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: govoice:v1.0.0
    container_name: govoice-server
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256M
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - govoice_logs:/var/log/govoice:rw
    # Provider keys come from the environment only and are never stored: put them in
    # deploy/govoice.env (chmod 600, not committed), one per line, e.g. XAI_API_KEY=...,
    # GOOGLE_API_KEY=..., MCP_TOKEN_CRM=... (docs/providers.md lists every variable).
    # A Google service account is a file: mount it read-only and point
    # GOOGLE_APPLICATION_CREDENTIALS at the path inside the container.
    env_file:
      - path: ./govoice.env
        required: false
    environment:
      - TOKEN_SECRET=${TOKEN_SECRET:?TOKEN_SECRET is required and must not be the public development key}
      - GOVOICE_MANAGEMENT_API_KEY=${GOVOICE_MANAGEMENT_API_KEY:?GOVOICE_MANAGEMENT_API_KEY is required (>= 32 bytes)}
      # POSTGRES_PASSWORD must be URL-safe (e.g. openssl rand -hex 24).
      - GOVOICE_DATABASE_DSN=postgres://govoice:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/govoice?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080" # Public WebSocket / Health (proxied via NGINX)
      - "127.0.0.1:9092:9092" # Probe listener: /health /ready /metrics only (internal; never publish on 0.0.0.0)
      # The management API (admin_listen_addr, 127.0.0.1:9090 inside the container) is deliberately not
      # published: use `docker exec govoice-server curl http://127.0.0.1:9090/api/v1/...`.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M

  # Flow store (config/production.yaml: storage.dialect postgres).
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: govoice-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=govoice
      - POSTGRES_DB=govoice
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - govoice_db:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "govoice", "-d", "govoice"]
      interval: 2s
      timeout: 2s
      retries: 30

  proxy:
    image: nginx:1.25-alpine@sha256:516475cc129da42866742567714ddc681e5eed7b9ee0b9e9c015e464b4221a00
    container_name: govoice-proxy
    restart: unless-stopped
    depends_on:
      - govoice
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw
      - /var/run:rw

volumes:
  govoice_logs:
  govoice_db:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
