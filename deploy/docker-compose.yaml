# Production Docker Compose definition for Voice Framework V1
# Fulfills spec §39 (Non-root, read-only root, declared writables, capability drops, health checks)

version: "3.8"

services:
  govoice:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: govoice:v1.0.0
    container_name: govoice-server
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256M
    volumes:
      - govoice_logs:/var/log/govoice:rw
    environment:
      - TOKEN_SECRET=${TOKEN_SECRET:-dev-insecure-secret-key-for-testing-only-12345}
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/govoice/credentials/gcp.json
      - XAI_API_KEY=${XAI_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080" # Public WebSocket / Health (proxied via NGINX)
      - "127.0.0.1:9090:9090" # Admin Metrics / Readiness (internal only)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M

  proxy:
    image: nginx:1.25-alpine
    container_name: govoice-proxy
    restart: unless-stopped
    depends_on:
      - govoice
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw
      - /var/run:rw

volumes:
  govoice_logs:
