# Reference NGINX reverse-proxy configuration for Voice Framework V1
# Fulfills spec §20 (TLS/WSS enforcement), §30 (Token query redaction), and §39 (Deployment)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Map to sanitize and redact the admission token parameter from access logs (spec §30)
    map $request_uri $sanitized_request_uri {
        ~*(?P<prefix>.*[?&]token=)[^&]*(?P<suffix>.*) "${prefix}[REDACTED]${suffix}";
        default $request_uri;
    }

    # Structured JSON log format with token redaction
    log_format json_combined escape=json
        '{"time_local":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$sanitized_request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_origin":"$http_origin",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Docker's DNS. A variable proxy_pass resolves at request time, so Nginx
    # can start while the server container is still coming up.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name voice.example.com;
        return 301 https://$host$request_uri;
    }

    # Public HTTPS & WSS Voice Surface
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name voice.example.com;

        # TLS Configuration
        ssl_certificate /etc/ssl/certs/voice.example.com.crt;
        ssl_certificate_key /etc/ssl/certs/voice.example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Public process liveness check
        location = /health {
            set $govoice_public govoice:8080;
            proxy_pass http://$govoice_public;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint (WSS)
        location = /ws {
            set $govoice_public govoice:8080;
            proxy_pass http://$govoice_public;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout matching maximum call duration
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Block direct access to admin endpoints on public surface
        location /metrics {
            return 404;
        }
        location /debug/ {
            return 404;
        }
    }

    # Protected Administrative Surface (internal/VPN only)
    server {
        listen 9091 ssl;
        server_name admin-voice.internal;

        ssl_certificate /etc/ssl/certs/admin.crt;
        ssl_certificate_key /etc/ssl/certs/admin.key;

        # Restrict to internal CIDRs
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        # Only the probe listener (/health, /ready, /metrics). The management API and /debug/timeline
        # stay on the container's loopback admin listener and are never proxied.
        location ~ ^/(health|ready|metrics)$ {
            set $govoice_probe govoice:9092;
            proxy_pass http://$govoice_probe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            return 404;
        }
    }
}
