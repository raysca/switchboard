# The simulated provider (providers/echo): needs no key and mirrors Google's models, voices and
# languages, so an agent built for Google runs on echo by changing only the provider. A test keeps
# these lists identical to google.yaml. They are closed (custom: false): the console offers no "Other…".
id: echo
name: Echo (simulated)
services:
  llm:
    keyless: true
    custom: false
    models:
      - {id: gemini-2.5-flash, label: Gemini 2.5 Flash, default: true}
  stt:
    keyless: true
    custom: false
    models:
      - {id: chirp_2, label: Chirp 2, default: true}
      - {id: latest_long, label: Latest long}
    languages:
      - {id: en-US, label: English (US), default: true}
  tts:
    keyless: true
    custom: false
    voices:
      - {id: en-US-Chirp3-HD-Aoede, label: Chirp 3 HD Aoede (en-US), default: true}
