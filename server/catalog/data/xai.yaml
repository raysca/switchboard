id: xai
name: xAI
credentials:
  - id: key
    label: xAI API key
    fields:
      api_key: {env: XAI_API_KEY}
    assemble: token
services:
  llm:
    credential: [key]
    models:
      - {id: grok-4.20-0309-non-reasoning, label: Grok 4.20 (non-reasoning), default: true}
      - {id: grok-4.7, label: Grok 4.7}
      - {id: grok-4.6, label: Grok 4.6}
      - {id: grok-4.5, label: Grok 4.5}
      - {id: grok-4.3, label: Grok 4.3}
  stt:
    credential: [key]
    models:
      - {id: grok-voice-transcribe-2.0, label: Grok voice transcribe 2.0, default: true}
    languages:
      - {id: en, label: English, default: true}
  tts:
    credential: [key]
    voices:
      - {id: altair, label: Altair}
      - {id: ara, label: Ara}
      - {id: atlas, label: Atlas}
      - {id: aurora, label: Aurora}
      - {id: carina, label: Carina}
      - {id: castor, label: Castor}
      - {id: celeste, label: Celeste}
      - {id: cosmo, label: Cosmo}
      - {id: eve, label: Eve, default: true}
      - {id: helios, label: Helios}
      - {id: helix, label: Helix}
      - {id: iris, label: Iris}
      - {id: kepler, label: Kepler}
      - {id: leo, label: Leo}
      - {id: liora, label: Liora}
      - {id: lumen, label: Lumen}
      - {id: luna, label: Luna}
      - {id: lux, label: Lux}
      - {id: naksh, label: Naksh}
      - {id: orion, label: Orion}
      - {id: perseus, label: Perseus}
      - {id: rex, label: Rex}
      - {id: rigel, label: Rigel}
      - {id: sal, label: Sal}
      - {id: sirius, label: Sirius}
      - {id: ursa, label: Ursa}
      - {id: zagan, label: Zagan}
      - {id: zenith, label: Zenith}
