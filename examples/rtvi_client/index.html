<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Framework V1 — Pipecat RTVI Test Client</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --accent: #a855f7;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: var(--primary);
    }
    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      width: 100%;
    }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-muted); }
    .error { color: var(--danger); font-size: 13px; min-height: 1em; width: 100%; }
    .text-row { display: flex; gap: 10px; margin-top: 12px; }
    .text-row input { flex: 1; }
    input {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      min-width: 0;
    }
    select, button {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
    }
    button.primary {
      background: #0284c7;
      border-color: #0284c7;
      color: white;
    }
    button.primary:hover {
      background: #0369a1;
    }
    button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0f172a;
      border-radius: 8px;
      font-size: 13px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.disconnected { background: #334155; color: #94a3b8; }
    .badge.connected { background: #14532d; color: #4ade80; }
    .badge.speaking { background: #581c87; color: #c084fc; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .transcript-box {
      min-height: 280px;
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .message {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 85%;
    }
    .message.user {
      align-self: flex-end;
      background: #1e3a8a;
      color: #e0e7ff;
    }
    .message.bot {
      align-self: flex-start;
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .message.interim {
      opacity: 0.7;
      font-style: italic;
    }
    .meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Voice Framework V1 — Pipecat RTVI Test Client</h1>
      <p class="subtitle">End-to-End WebSocket Voice &amp; Text Conversation with a Stored Agent</p>
    </header>

    <div class="card controls">
      <div class="fields">
        <label class="field">Admin URL
          <input id="adminUrl" type="url" value="http://127.0.0.1:9090" autocomplete="off">
        </label>
        <label class="field">Management key
          <input id="managementKey" type="password" autocomplete="off">
        </label>
        <label class="field">Agent ID
          <input id="agentId" type="text" autocomplete="off">
        </label>
        <label class="field">Server WebSocket URL
          <input id="wsUrl" type="url" value="ws://127.0.0.1:8080/ws" autocomplete="off">
        </label>
      </div>

      <div style="display: flex; gap: 10px;">
        <button id="btnConnect" class="primary">Connect</button>
        <button id="btnDisconnect" class="danger" disabled>Disconnect</button>
      </div>
      <div id="errorMsg" class="error" role="alert" data-testid="connection-error"></div>
    </div>

    <div class="card">
      <div class="status-bar">
        <div>
          <span>Status: </span>
          <span id="connBadge" class="badge disconnected" data-testid="connection-status" role="status">Disconnected</span>
        </div>
        <div>
          <span>Speech State: </span>
          <span id="speechState" style="color: var(--text-muted); font-weight: 500;">Idle</span>
        </div>
      </div>

      <div style="margin-top: 16px;">
        <div class="meta">Conversation Stream</div>
        <div id="transcriptBox" class="transcript-box" aria-live="polite">
          <div class="message bot">
            <div class="meta">System</div>
            Enter the admin URL, management key and agent ID, then click <strong>Connect</strong>. Speak, or type a message and click <strong>Send text</strong>.
          </div>
        </div>
        <form id="textForm" class="text-row">
          <label for="messageInput" class="meta" style="align-self: center; margin: 0;">Message</label>
          <input id="messageInput" type="text" autocomplete="off" disabled>
          <button id="btnSendText" type="submit" class="primary" disabled>Send text</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let micCtx = null;
    let scriptProcessor = null;
    let currentBotMsgEl = null;

    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const configInputs = ['adminUrl', 'managementKey', 'agentId', 'wsUrl'].map(id => document.getElementById(id));
    const [adminUrlInput, managementKeyInput, agentIdInput, wsUrlInput] = configInputs;
    const errorMsg = document.getElementById('errorMsg');

    // Prefill from the client server (make example-web); the page still works
    // with the fields typed by hand.
    fetch('/api/defaults').then(r => r.ok ? r.json() : null).then(d => {
      if (!d) return;
      adminUrlInput.value = d.adminUrl || adminUrlInput.value;
      wsUrlInput.value = d.wsUrl || wsUrlInput.value;
      agentIdInput.value = agentIdInput.value || d.agentId || '';
      if (d.serverKey) managementKeyInput.placeholder = 'Held by the client server (optional)';
    }).catch(() => {});
    const textForm = document.getElementById('textForm');
    const messageInput = document.getElementById('messageInput');
    const btnSendText = document.getElementById('btnSendText');
    let textSeq = 0;

    function setStatus(text, cls) {
      connBadge.className = `badge ${cls}`;
      connBadge.textContent = text;
    }

    function setTextEnabled(enabled) {
      messageInput.disabled = !enabled;
      btnSendText.disabled = !enabled;
    }
    const connBadge = document.getElementById('connBadge');
    const speechState = document.getElementById('speechState');
    const transcriptBox = document.getElementById('transcriptBox');

    function appendMessage(role, text, isInterim = false) {
      if (isInterim) {
        let el = document.getElementById('interimMsg');
        if (!el) {
          el = document.createElement('div');
          el.id = 'interimMsg';
          el.className = 'message user interim';
          transcriptBox.appendChild(el);
        }
        el.innerHTML = `<div class="meta">User (transcribing...)</div>${escapeHtml(text)}`;
        transcriptBox.scrollTop = transcriptBox.scrollHeight;
        return;
      }

      // Remove interim if present
      const interim = document.getElementById('interimMsg');
      if (interim) interim.remove();

      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.dataset.testid = `transcript-${role}`;
      msg.innerHTML = `<div class="meta">${role === 'user' ? 'User' : 'Assistant'}</div><span class="text">${escapeHtml(text)}</span>`;
      transcriptBox.appendChild(msg);
      transcriptBox.scrollTop = transcriptBox.scrollHeight;
      return msg;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Connect handler: issue a single-use voice token via server.js, then open the WebSocket.
    btnConnect.addEventListener('click', async () => {
      btnConnect.disabled = true;
      configInputs.forEach(i => i.disabled = true);
      errorMsg.textContent = '';
      setStatus('Connecting...', 'disconnected');

      try {
        const res = await fetch('/api/voice-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            adminUrl: adminUrlInput.value.trim(),
            managementKey: managementKeyInput.value,
            agentId: agentIdInput.value.trim()
          })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body?.data?.token) {
          const code = body?.error?.code || `http_${res.status}`;
          throw new Error(`voice token refused (${res.status} ${code}): ${body?.error?.message || res.statusText}`);
        }

        // 1. Initialize Audio Context for 24kHz output and microphone capture
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        await audioCtx.resume();

        // 2. Open WebSocket
        ws = new WebSocket(`${wsUrlInput.value.trim()}?token=${encodeURIComponent(body.data.token)}`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          btnDisconnect.disabled = false;

          // Send client-ready RTVI event
          sendRtviMessage({
            id: 'init-001',
            label: 'rtvi-ai',
            type: 'client-ready',
            data: { version: '2.1.0' }
          });

          // Start Microphone Streaming
          startMicrophone();
        };

        ws.onmessage = (event) => {
          if (typeof event.data === 'string') {
            handleRtviJson(JSON.parse(event.data));
          } else if (event.data instanceof ArrayBuffer) {
            handleBinaryFrame(event.data);
          }
        };

        ws.onclose = (event) => {
          if (event.code !== 1000 && event.code !== 1005 && !errorMsg.textContent) {
            errorMsg.textContent = `Connection closed (${event.code}${event.reason ? ': ' + event.reason : ''})`;
          }
          cleanup();
        };

        ws.onerror = (err) => {
          console.error('WebSocket Error:', err);
          cleanup();
        };

      } catch (err) {
        errorMsg.textContent = 'Connection error: ' + err.message;
        cleanup();
      }
    });

    btnDisconnect.addEventListener('click', () => {
      if (ws) ws.close();
      cleanup();
    });

    textForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      sendRtviMessage({
        id: `text-${Date.now()}-${++textSeq}`,
        label: 'rtvi-ai',
        type: 'send-text',
        data: { content: text }
      });
      // The server echoes the turn back as a final user-transcription and
      // interrupts any reply still playing.
      stopPlayback();
      currentBotMsgEl = null;
      messageInput.value = '';
    });

    function cleanup() {
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (scriptProcessor) {
        scriptProcessor.disconnect();
        scriptProcessor = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      if (micCtx) {
        micCtx.close();
        micCtx = null;
      }
      ws = null;
      btnConnect.disabled = false;
      btnDisconnect.disabled = true;
      configInputs.forEach(i => i.disabled = false);
      setTextEnabled(false);
      setStatus('Disconnected', 'disconnected');
      speechState.textContent = 'Idle';
      speechState.style.color = 'var(--text-muted)';
      currentBotMsgEl = null;
    }

    async function startMicrophone() {
      const myWs = ws; // this call's connection; a reconnect replaces ws
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            sampleRate: 16000,
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true
          }
        });
        if (ws !== myWs) {
          // Disconnected (or reconnected) while the permission prompt was open.
          stream.getTracks().forEach(t => t.stop());
          return;
        }
        micStream = stream;

        micCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = micCtx.createMediaStreamSource(micStream);

        // 20ms @ 16kHz = 320 samples -> buffer size 512 for ScriptProcessor
        scriptProcessor = micCtx.createScriptProcessor(512, 1, 1);
        source.connect(scriptProcessor);
        scriptProcessor.connect(micCtx.destination);

        scriptProcessor.onaudioprocess = (e) => {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          const float32 = e.inputBuffer.getChannelData(0);
          // Convert Float32 to PCM16LE
          const pcm16 = new Int16Array(float32.length);
          for (let i = 0; i < float32.length; i++) {
            let s = Math.max(-1, Math.min(1, float32[i]));
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }
          sendAudioFrame(pcm16.buffer, 16000);
        };
      } catch (err) {
        console.error('Microphone access denied or error:', err);
      }
    }

    // Minimal protobuf codec for proto/frames.proto:
    //   Frame         { AudioRawFrame audio = 2; MessageFrame message = 4; }
    //   AudioRawFrame { bytes audio = 3; uint32 sample_rate = 4; uint32 num_channels = 5; }
    //   MessageFrame  { string data = 1; }
    function writeVarint(arr, val) {
      while (val >= 0x80) {
        arr.push((val & 0x7F) | 0x80);
        val >>>= 7;
      }
      arr.push(val);
    }

    function writeBytesField(arr, field, bytes) {
      arr.push((field << 3) | 2);
      writeVarint(arr, bytes.length);
      for (const b of bytes) arr.push(b);
    }

    function sendAudioFrame(pcmBuffer, sampleRate) {
      const audio = [];
      writeBytesField(audio, 3, new Uint8Array(pcmBuffer));
      audio.push(4 << 3); writeVarint(audio, sampleRate);
      audio.push(5 << 3); writeVarint(audio, 1);
      const frame = [];
      writeBytesField(frame, 2, audio);
      ws.send(new Uint8Array(frame));
    }

    function sendRtviMessage(jsonObj) {
      const message = [];
      writeBytesField(message, 1, new TextEncoder().encode(JSON.stringify(jsonObj)));
      const frame = [];
      writeBytesField(frame, 4, message);
      ws.send(new Uint8Array(frame));
    }

    function readVarint(arr, pos) {
      let res = 0, mul = 1;
      while (pos < arr.length) {
        const b = arr[pos++];
        res += (b & 0x7F) * mul;
        if ((b & 0x80) === 0) break;
        mul *= 128;
      }
      return [res, pos];
    }

    // Returns {fieldNumber: value}: varints as numbers, length-delimited as Uint8Array.
    function readFields(u8) {
      const fields = {};
      let pos = 0;
      while (pos < u8.length) {
        let key, len;
        [key, pos] = readVarint(u8, pos);
        const field = Math.floor(key / 8), wire = key & 7;
        if (wire === 0) [fields[field], pos] = readVarint(u8, pos);
        else if (wire === 2) { [len, pos] = readVarint(u8, pos); fields[field] = u8.subarray(pos, pos + len); pos += len; }
        else if (wire === 1) pos += 8;
        else if (wire === 5) pos += 4;
        else break;
      }
      return fields;
    }

    function handleBinaryFrame(buf) {
      const frame = readFields(new Uint8Array(buf));
      if (frame[4]) {
        const data = readFields(frame[4])[1];
        if (data) {
          try { handleRtviJson(JSON.parse(new TextDecoder().decode(data))); } catch (e) {}
        }
      } else if (frame[2]) {
        const audio = readFields(frame[2]);
        if (audio[3]) playAudioBuffer(audio[3], audio[4] || 24000);
      }
    }

    let nextPlayTime = 0;
    let playing = []; // scheduled AudioBufferSourceNodes

    // Barge-in (speech or a typed turn): drop audio already scheduled locally.
    function stopPlayback() {
      for (const node of playing) {
        try { node.stop(); } catch (e) {}
      }
      playing = [];
      nextPlayTime = 0;
    }
    function playAudioBuffer(pcmBytes, sampleRate) {
      if (!audioCtx) return;
      // Copy: PCM16 needs 2-byte alignment, and a subarray offset may be odd.
      const int16 = new Int16Array(pcmBytes.slice(0, pcmBytes.byteLength & ~1).buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) {
        float32[i] = int16[i] / 32768.0;
      }

      const audioBuf = audioCtx.createBuffer(1, float32.length, sampleRate);
      audioBuf.copyToChannel(float32, 0);
      const node = audioCtx.createBufferSource();
      node.buffer = audioBuf;
      node.connect(audioCtx.destination);
      playing.push(node);
      node.onended = () => { playing = playing.filter(n => n !== node); };

      let now = audioCtx.currentTime;
      let start = Math.max(now, nextPlayTime);
      node.start(start);
      nextPlayTime = start + audioBuf.duration;
    }

    function handleRtviJson(msg) {
      switch (msg.type) {
        case 'bot-ready':
          console.log('Bot ready:', msg);
          setStatus('Connected', 'connected');
          setTextEnabled(true);
          break;
        case 'error':
          errorMsg.textContent = `Server error: ${msg.data?.error || 'unknown'}${msg.data?.fatal ? ' (fatal)' : ''}`;
          break;
        case 'user-started-speaking':
          speechState.textContent = 'Speaking...';
          speechState.style.color = '#c084fc';
          stopPlayback(); // barge-in
          break;
        case 'user-stopped-speaking':
          speechState.textContent = 'Listening...';
          speechState.style.color = '#38bdf8';
          break;
        case 'user-transcription':
          if (msg.data && msg.data.final) {
            currentBotMsgEl = null;
            appendMessage('user', msg.data.text);
          } else if (msg.data && msg.data.text) {
            appendMessage('user', msg.data.text, true);
          }
          break;
        case 'bot-llm-text':
          if (msg.data && msg.data.text) {
            if (!currentBotMsgEl) {
              currentBotMsgEl = appendMessage('bot', '');
            }
            currentBotMsgEl.querySelector('.text').textContent += msg.data.text;
            transcriptBox.scrollTop = transcriptBox.scrollHeight;
          }
          break;
        case 'bot-started-speaking':
          speechState.textContent = 'Bot Speaking';
          speechState.style.color = '#4ade80';
          break;
        case 'bot-stopped-speaking':
          speechState.textContent = 'Idle';
          speechState.style.color = 'var(--text-muted)';
          currentBotMsgEl = null;
          break;
      }
    }
  </script>
</body>
</html>
