profile: production
insecure_overrides:
  allow_plain_ws_in_production: false

public_listen_addr: "0.0.0.0:8080"
# Management API (/api/v1, bearer auth) and /debug/timeline: container loopback only. Reach it with
# `docker exec` / `kubectl port-forward`; never bind it beyond loopback.
admin_listen_addr: "127.0.0.1:9090"
# Probe listener: ONLY /health, /ready and /metrics (no auth, no management API, no per-call data), so
# kubelet probes and Prometheus can reach the container. Keep it off public networks (compose publishes
# it on 127.0.0.1 only; in Kubernetes expose it to the cluster network, not through the ingress).
probe_listen_addr: "0.0.0.0:9092"

tls:
  cert_file: ""
  key_file: ""
  trusted_proxy_mode: true
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
    - "172.16.0.0/12"

origin_allowlist:
  - "https://app.govoice.internal"

token:
  secret_env: "TOKEN_SECRET"
  secret: ""
  issuer: "govoice-v1"
  audience: "govoice-v1-client"
  max_lifetime: 5m
  clock_skew: 30s
  replay_cache_limit: 50000
  key_id: "v1"

limits:
  max_pending_handshakes: 100
  max_sessions: 250
  max_sessions_per_principal: 5
  # max_sessions_per_agent: 0         # 0 = unlimited
  # start_rate_per_principal: 0       # starts/sec per principal; 0 = unlimited
  # handshake_rate_per_ip: 20         # WebSocket upgrades/sec per source IP (burst max(5, 2x)); 0 = default 20
  # start_burst_per_principal: 1      # required >= 1 when rate > 0
  max_sessions_per_ip: 5
  upgrade_timeout: 5s
  ready_timeout: 10s
  max_call_duration: 60m
  # idle_timeout is the legacy data-silence disconnect, used only when ping_interval: 0
  idle_timeout: 30s
  ping_interval: 15s   # server WebSocket ping; a peer missing 2 pings in a row (each ping_timeout) is dropped
  ping_timeout: 10s
  # Recommended: ping_interval/ping_timeout above drop dead peers (2 missed pings); a live but abandoned tab
  # still answers pings and holds its slot until max_call_duration. Also set idle.user_timeout (see the
  # idle block at the end of this file) so silent callers are prompted and hung up.
  drain_timeout: 45s
  immediate_cancel: false

vad:
  mode: "process"
  workers: 8
  batch: 8
  model_path: "/opt/govoice/models/silero_vad.onnx"
  ort_lib_path: "/opt/govoice/lib/libonnxruntime.so"
  queue_cap: 8192
  stop_ms: 800         # silence that ends a VAD speech segment (200..2000, 32 ms steps); lower = faster replies, more mid-sentence cuts

# Provider infrastructure only. Models, voices, prompts and credentials belong to
# stored agents and provider credentials (see /api/v1/agents, /api/v1/providers).
providers:
  google_stt:
    project_id: ""
    location: "us-central1"
    rotation_threshold: 240s
  google_tts:
    sample_rate: 24000
  xai_llm:
    endpoint: "https://api.x.ai/v1/responses"

observability:
  log_level: "info"
  json_format: true
  timeline_max_events: 1000
  timeline_ttl: 15m

# Agent store (required): calls run stored agents with stored provider
# credentials. The server requires:
#   GOVOICE_DATABASE_DSN     storage DSN (file path for sqlite, URL for postgres)
#   GOVOICE_CREDENTIAL_KEYS  "id:base64(32-byte key)[,id:...]", first is active
storage:
  dialect: "postgres"

# Content/metadata purge job.
retention:
  enabled: true
  interval: 1h
  content_retention_days: 7
  metadata_retention_days: 30
  batch_size: 500

# Provider connection reuse and pre-dial (P2-9, docs/operations_runbook.md).
# enabled shares one tuned HTTP transport per provider across calls (safe).
# predial opens one TCP/TLS spare per candidate provider at call setup;
# keep it off until measured live (see "Connection warm-up" in the runbook).
warmup:
  enabled: true
  predial: false
  on_start: false

# Hang up callers who stay silent or abandon the tab (a live but abandoned tab still answers pings and
# would hold its slot and provider streams until max_call_duration). After 2 prompts at 30 s each the
# call ends; raise user_timeout if your agents legitimately wait on long tool calls.
idle: {user_timeout: 30s, max_prompts: 2}
