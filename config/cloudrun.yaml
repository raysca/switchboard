# Cloud Run: ONE service, ONE public port (8080). The management API and the admin UI are served
# on it behind the management key (public_admin). One instance (live calls are in memory); agents and
# call history are in Cloud SQL (Postgres) through the unix socket Cloud Run mounts, so they survive
# deploys and restarts. The server is clean-room: it installs no demo. Demos are optional and seeded
# by the separate demo pipeline (.github/workflows/deploy-demo.yml) against the management API.
profile: production

public_listen_addr: "0.0.0.0:8080"
admin_listen_addr: "127.0.0.1:9090"   # unused by the single-port deployment; required by the config checks
probe_listen_addr: ""

public_admin:
  enabled: true

tls:
  cert_file: ""
  key_file: ""
  trusted_proxy_mode: true
  # Cloud Run's front end is the only peer the container sees. Verify the real peer against
  # GET /api/v1/server-config client_ip after the first deploy, and do not attach VPC ingress
  # without re-checking trusted_proxies.
  trusted_proxies:
    - "169.254.0.0/16"

# The page is served by this service, so the browser's own origin is allowed without listing it.
# origin_allowlist is empty on purpose: an empty allowlist keeps AllowMissingOrigin true so
# non-browser clients (the CLI) work, and a foreign browser Origin is still rejected by the
# same-host rule.
origin_allow_same_host: true
origin_allowlist: []

token:
  secret_env: "TOKEN_SECRET"
  issuer: "govoice-v1"
  audience: "govoice-v1-client"
  max_lifetime: 1m
  clock_skew: 30s
  replay_cache_limit: 50000
  key_id: "v1"

limits:
  max_pending_handshakes: 20
  max_sessions: 10
  max_sessions_per_principal: 5
  max_sessions_per_ip: 5
  upgrade_timeout: 5s
  ready_timeout: 10s
  max_call_duration: 20m
  idle_timeout: 30s
  ping_interval: 15s
  ping_timeout: 10s
  drain_timeout: 45s
  immediate_cancel: false

vad:
  mode: "process"
  workers: 2
  batch: 8
  model_path: "/opt/govoice/models/silero_vad.onnx"
  ort_lib_path: "/opt/govoice/lib/libonnxruntime.so"
  queue_cap: 2048
  stop_ms: 200

providers:
  google_stt:
    project_id: ""
    location: "us-central1"
    rotation_threshold: 240s
  google_tts:
    sample_rate: 24000
  xai_llm:
    endpoint: "https://api.x.ai/v1/responses"

observability:
  log_level: "info"
  json_format: true
  timeline_max_events: 1000
  timeline_ttl: 15m

# GOVOICE_DATABASE_DSN is a postgres:// URL (the SWITCHBOARD_DATABASE_DSN secret), e.g.
# postgres://switchboard:<password>@/switchboard?host=/cloudsql/<project>:<region>:switchboard-db&sslmode=disable
storage:
  dialect: "postgres"

retention:
  enabled: true
  interval: 1h
  content_retention_days: 1
  metadata_retention_days: 7
  batch_size: 200

warmup:
  enabled: true
  predial: false
  on_start: false

idle: {user_timeout: 30s, max_prompts: 2}
