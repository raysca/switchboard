profile: development
insecure_overrides:
  allow_plain_ws_in_production: false

public_listen_addr: "127.0.0.1:8080"
admin_listen_addr: "127.0.0.1:9090"

tls:
  cert_file: ""
  key_file: ""
  trusted_proxy_mode: false

origin_allowlist:
  - "http://localhost:3000"
  - "https://localhost:3000"
  - "*"

token:
  secret_env: "TOKEN_SECRET"
  secret: "dev-insecure-secret-key-for-testing-only-12345"
  issuer: "govoice-v1"
  audience: "govoice-v1-client"
  key_id: "v1"
  max_lifetime: 1m
  clock_skew: 30s
  replay_cache_limit: 10000

limits:
  max_pending_handshakes: 50
  max_sessions: 100
  max_sessions_per_principal: 5
  # max_sessions_per_flow: 0         # 0 = unlimited
  # start_rate_per_principal: 0       # starts/sec per principal; 0 = unlimited
  # handshake_rate_per_ip: 20         # WebSocket upgrades/sec per source IP (burst max(5, 2x)); 0 = default 20
  # start_burst_per_principal: 1      # required >= 1 when rate > 0
  upgrade_timeout: 5s
  ready_timeout: 10s
  max_call_duration: 30m
  # idle_timeout is the legacy data-silence disconnect, used only when ping_interval: 0
  idle_timeout: 60s
  ping_interval: 15s   # server WebSocket ping; a peer missing 2 pings in a row (each ping_timeout) is dropped
  ping_timeout: 10s
  drain_timeout: 30s
  immediate_cancel: false

vad:
  mode: "inprocess"
  workers: 4
  batch: 8
  model_path: "third_party/silero_vad.onnx"
  ort_lib_path: ""
  queue_cap: 8192
  stop_ms: 200         # silence that ends a VAD speech segment (200..2000, 32 ms steps); the turn manager's speech timeout guards mid-sentence cuts

# Provider infrastructure only. Models, voices and prompts belong to stored flows;
# provider secrets come from the environment (variables listed by GET /api/v1/providers).
providers:
  google_stt:
    project_id: ""
    location: "us-central1"
    rotation_threshold: 240s
  google_tts:
    sample_rate: 24000
  xai_llm:
    endpoint: "https://api.x.ai/v1/responses"
  xai_stt:
    endpoint: "wss://api.x.ai/v1/stt"
  xai_tts:
    endpoint: "https://api.x.ai/v1/tts"

observability:
  log_level: "debug"
  json_format: false
  timeline_max_events: 500
  timeline_ttl: 10m

# Flow store (required): calls run stored flows. The server requires:
#   GOVOICE_DATABASE_DSN     storage DSN (file path for sqlite, URL for postgres)
# In this development profile it is optional: when unset the server creates
# .govoice-dev/switchboard.db (override the directory with GOVOICE_DEV_DIR).
# Production always requires it.
# Local test MCP servers (make mcp-test, make dev) run on plain HTTP at loopback.
# Development and tests only: the production profile refuses this setting.
# MCP servers are re-checked in the background every mcp.sync_interval
# (default 5m; 0 = off; 30s to 24h when on).
mcp:
  allow_local_http: true

storage:
  dialect: "sqlite"

# Content/metadata purge job.
retention:
  enabled: true
  interval: 1h
  content_retention_days: 7
  metadata_retention_days: 30
  batch_size: 500

# Provider connection reuse and pre-dial (P2-9, docs/operations.md).
# enabled shares one tuned HTTP transport per provider across calls (safe).
# predial opens one TCP/TLS spare per candidate provider at call setup;
# keep it off until measured live (see "Connection warm-up" in docs/operations.md).
warmup:
  enabled: true
  predial: false
  on_start: false

# Optional features, all off by default. Each block loads as written once
# uncommented (TestDevelopmentYAMLExamplesLoad). Defaults and semantics for every key:
# docs/pipecat-parity-matrix.md ("Default" column) and docs/quickstart.md.
# stt: {replay_buffer: 10s}              # STT failover replay window
# turn:
#   manager: true                        # on by default; false ends turns on the raw VAD stop (set vad.stop_ms: 800)
#   min_words: 0                         # >0: barge-in needs N words
#   stop: [speech-timeout]               # speech-timeout | eager | llm-completion | turn-analyzer
#   speech_timeout: 600ms                # resume window after the VAD stop
#   no_transcript_timeout: 5s            # end a turn that never got a transcript
#   stt_p99: {}                          # provider: duration, overrides the built-in STT p99
#   eager_grace: 200ms
#   completion: {}                       # llm-completion tuning
#   mute: []                             # always | first_speech | until_first_bot_complete | function_call
#   max_mute: 30s
#   analyzer: {mode: "", workers: 1, model_path: third_party/smart_turn_v3.2_cpu.onnx, stop_secs: 3s, budget: 150ms, for_flows: false}  # for_flows: load the model so flows can choose end_of_turn smart (off: no worker process)
# first_clause_chars: 0                  # try 40 for earlier first audio
# tts_merge: {enabled: false, margin: 300ms, cap: 250}  # xai/google only: merge sentences while audio slack allows (fewer requests); implies first_clause_chars 40 if 0
# audio:
#   input_filters: []                    # [denoise]
#   denoise_strength: 0.5
#   output_gain_db: 0
#   backgrounds: {office: {file: ambience.wav, gain_db: -30, loop: true}}  # named sounds a call (or its flow) can play under the voice
#   background_default: office       # every call plays this unless its flow picks another; empty: none
#   allow_flow_background: true      # a flow may pick a sound from backgrounds (default true here, false in production)
# idle: {user_timeout: 15s, max_prompts: 2, prompt: "Are you still there?", prompt_mode: "", goodbye: "I'll end the call now. Goodbye.", bot_timeout: 0s, bot_max_stuck: 3, bot_fallback: ""}  # user_timeout: 0s turns quiet-caller handling off; a flow can set its own
# dtmf: {detect: false, aggregate: false, send_tool: false, aggregate_timeout: 2s}
# recording: {enabled: false, dir: "", retention_days: 7, max_duration: 1h, max_bytes: 268435456}
# privacy:
#   redaction: {enabled: false, rules: [], dtmf: always}
# otel: {enabled: false, endpoint: "", protocol: "", sampling_ratio: 1.0, service_name: "", capture_content: false}
# providers:
#   openai_llm: {allow_private_base_url: false}   # self-hosted OpenAI-compatible endpoints
# nvidia secrets come from the environment, not from this file (not a config block):
# - nvidia.llm: NVIDIA_API_KEY (default model openai/gpt-oss-20b, base https://integrate.api.nvidia.com/v1)
# - nvidia.stt/tts: NVIDIA_API_KEY plus NVIDIA_STT_FUNCTION_ID=1598d209-5e27-4d3c-8079-4751568b1081 and NVIDIA_TTS_FUNCTION_ID=877104f7-e885-42b9-8de8-f6e4c6303969
# - (NVCF hosted Parakeet CTC 1.1b ASR and Magpie TTS Multilingual, voice Magpie-Multilingual.EN-US.Aria; verified live 2026-10)
