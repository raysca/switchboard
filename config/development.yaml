profile: development
insecure_overrides:
  allow_plain_ws_in_production: false
  skip_credential_perms_check: true

public_listen_addr: "127.0.0.1:8080"
admin_listen_addr: "127.0.0.1:9090"

tls:
  cert_file: ""
  key_file: ""
  trusted_proxy_mode: false

origin_allowlist:
  - "http://localhost:3000"
  - "https://localhost:3000"
  - "*"

token:
  secret_env: "TOKEN_SECRET"
  secret: "dev-insecure-secret-key-for-testing-only-12345"
  issuer: "govoice"
  audience: "govoice-rtvi"
  max_lifetime: 5m
  clock_skew: 30s
  replay_cache_limit: 10000

limits:
  max_pending_handshakes: 50
  max_sessions: 100
  max_sessions_per_principal: 5
  upgrade_timeout: 5s
  ready_timeout: 10s
  max_call_duration: 30m
  idle_timeout: 60s
  drain_timeout: 30s
  immediate_cancel: false

vad:
  mode: "inprocess"
  workers: 4
  batch: 8
  model_path: "third_party/silero_vad.onnx"
  ort_lib_path: ""
  queue_cap: 8192

providers:
  google_stt:
    project_id: ""
    location: "us-central1"
    model: "chirp_2"
    language_code: "en-US"
    max_streams: 100
    rotation_threshold: 240s
    rotation_headroom_multiplier: 2.0
    credentials_file: ""
  google_llm:
    model: "gemini-2.5-flash"
    auth_mode: "vertex_adc"
    system_prompt: "You are a helpful voice assistant."
    api_key_env: "GOOGLE_API_KEY"
  google_tts:
    voice: "en-US-Journey-F"
    sample_rate: 24000
    credentials_file: ""
  xai_llm:
    model: "grok-2-1212"
    endpoint: "https://api.x.ai/v1/responses"
    api_key_env: "XAI_API_KEY"
    system_prompt: "You are a helpful voice assistant powered by Grok."
  xai_stt:
    endpoint: "wss://api.x.ai/v1/stt"
    api_key_env: "XAI_API_KEY"
    language: "en"
  xai_tts:
    endpoint: "https://api.x.ai/v1/tts"
    api_key_env: "XAI_API_KEY"
    voice: "eve"
    language: "en"

pipelines:
  default:
    stt: "google.stt"
    llm: "google.llm"
    tts: "google.tts"
    max_messages: 20
    max_tokens: 4000
  xai:
    stt: "google.stt"
    llm: "xai.llm"
    tts: "google.tts"
    max_messages: 20
    max_tokens: 4000
  full_xai:
    stt: "xai.stt"
    llm: "xai.llm"
    tts: "xai.tts"
    max_messages: 20
    max_tokens: 4000

observability:
  log_level: "debug"
  json_format: false
  enable_transcript_logging: false
  timeline_max_events: 500
  timeline_ttl: 10m
