profile: development
insecure_overrides:
  allow_plain_ws_in_production: false

public_listen_addr: "127.0.0.1:8080"
admin_listen_addr: "127.0.0.1:9090"

tls:
  cert_file: ""
  key_file: ""
  trusted_proxy_mode: false

origin_allowlist:
  - "http://localhost:3000"
  - "https://localhost:3000"
  - "*"

token:
  secret_env: "TOKEN_SECRET"
  secret: "dev-insecure-secret-key-for-testing-only-12345"
  issuer: "govoice-v1"
  audience: "govoice-v1-client"
  key_id: "v1"
  max_lifetime: 5m
  clock_skew: 30s
  replay_cache_limit: 10000

limits:
  max_pending_handshakes: 50
  max_sessions: 100
  max_sessions_per_principal: 5
  upgrade_timeout: 5s
  ready_timeout: 10s
  max_call_duration: 30m
  idle_timeout: 60s
  drain_timeout: 30s
  immediate_cancel: false

vad:
  mode: "inprocess"
  workers: 4
  batch: 8
  model_path: "third_party/silero_vad.onnx"
  ort_lib_path: ""
  queue_cap: 8192

# Provider infrastructure only. Models, voices, prompts and credentials belong to
# stored agents and provider credentials (see /api/v1/agents, /api/v1/providers).
providers:
  google_stt:
    project_id: ""
    location: "us-central1"
    max_streams: 100
    rotation_threshold: 240s
    rotation_headroom_multiplier: 2.0
  google_tts:
    sample_rate: 24000
  xai_llm:
    endpoint: "https://api.x.ai/v1/responses"
  xai_stt:
    endpoint: "wss://api.x.ai/v1/stt"
  xai_tts:
    endpoint: "https://api.x.ai/v1/tts"

observability:
  log_level: "debug"
  json_format: false
  timeline_max_events: 500
  timeline_ttl: 10m

# Agent store (required): calls run stored agents with stored provider
# credentials. The server requires:
#   GOVOICE_DATABASE_DSN     storage DSN (file path for sqlite, URL for postgres)
#   GOVOICE_CREDENTIAL_KEYS  "id:base64(32-byte key)[,id:...]", first is active
# In this development profile both are optional: when unset the server creates
# .govoice-dev/govoice.db and a persisted key in .govoice-dev/credential.key
# (override the directory with GOVOICE_DEV_DIR). Production always requires both.
storage:
  dialect: "sqlite"

# Content/metadata purge job.
retention:
  enabled: true
  interval: 1h
  content_retention_days: 7
  metadata_retention_days: 30
  batch_size: 500
